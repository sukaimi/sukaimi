name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: sukaimi
          outputs: |
            dist/github-snake.svg?color_snake=8b7cdd&color_dots=#020414,#0d0d2b,#1a1245,#3d2b7a,#6b5eb0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=B4A0FF&color_dots=#020414,#0d0d2b,#1a1245,#3d2b7a,#8b7cdd

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
